# name of the action
name: publish

# trigger on push events with branch main
on:
  push:
    branches: [main]

# pipeline to execute
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          # use version from go.mod file
          go-version-file: 'go.mod'
          cache: true

      - name: build
        env:
          GOOS: linux
          CGO_ENABLED: '0'
        run: |
          go build -a \
            -ldflags '-s -w -extldflags "-static"' \
            -o release/secret-vault \
            github.com/go-vela/secret-vault/cmd/secret-vault

      - name: publish
        uses: elgohr/Publish-Docker-Github-Action@4feac4d53e4e55dcc5d3e2ad0ed2e0a76028ff7a # v5
        with:
          name: target/secret-vault
          cache: true
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
